name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: pnpm check (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  database:
    name: pnpm test:db (Node 22, PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: creator
          POSTGRES_PASSWORD: creator
          POSTGRES_DB: creator_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials; each test creates and drops its own database.
      CREATOR_TEST_DATABASE_URL: postgres://creator:creator@127.0.0.1:5432/creator_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The T17 backup/restore test needs a pg_dump at least as new as the server; fail loudly
      # here rather than let that test skip.
      - run: pg_dump --version
      # WSL2 isolation tests skip visibly here; they remain a manual Windows gate.
      - run: pnpm test:db

  windows:
    name: Windows contracts and database
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start disposable PostgreSQL
        shell: pwsh
        run: |
          $pgInstall = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'bin\initdb.exe') } | Sort-Object { [int]$_.Name } -Descending | Select-Object -First 1
          if (-not $pgInstall) { throw 'PostgreSQL client/server tools required for the Windows gate' }
          $pgBin = Join-Path $pgInstall.FullName 'bin'
          $data = Join-Path $env:RUNNER_TEMP 'creator-ci-pg'
          & (Join-Path $pgBin 'initdb.exe') -D $data -U creator_ci --auth=trust --encoding=UTF8 --no-locale
          if ($LASTEXITCODE -ne 0) { throw 'initdb failed' }
          & (Join-Path $pgBin 'pg_ctl.exe') -D $data -l (Join-Path $env:RUNNER_TEMP 'creator-ci-pg.log') -o '-h 127.0.0.1 -p 55439' -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed' }
          'CREATOR_TEST_DATABASE_URL=postgresql://creator_ci@127.0.0.1:55439/postgres' >> $env:GITHUB_ENV
          "CREATOR_PG_BIN=$pgBin" >> $env:GITHUB_ENV
          $pgBin >> $env:GITHUB_PATH
      - run: pnpm typecheck
      - run: pnpm test:db
      - run: pnpm format:check
      - name: Stop disposable PostgreSQL
        if: always()
        shell: pwsh
        run: |
          if ($env:CREATOR_PG_BIN) {
            & (Join-Path $env:CREATOR_PG_BIN 'pg_ctl.exe') -D (Join-Path $env:RUNNER_TEMP 'creator-ci-pg') -m fast -w stop
          }
